services:
  fastapi:
    build:
      context: ./
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:80"
      - "5678:5678" # puerto para debugpy
    volumes:
      - ./src:/app/src:ro
    env_file:
      - .env
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "-m",
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "80",
        "--reload",
        "--log-level",
        "debug",
      ]
    environment:
      # Local development - use local Valkey container (Redis-compatible)
      # For production/ElastiCache, set REDIS_URL in .env file instead
      - REDIS_HOST=${REDIS_HOST:-valkey}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Uncomment and set for ElastiCache:
      # - REDIS_URL=rediss://:password@your-elasticache-endpoint.cache.amazonaws.com:6379
      # - REDIS_USE_TLS=true
    depends_on:
      - dynamodb
      - valkey
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
  dynamodb:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
  # ...existing code...

  # DynamoDB web admin UI
  dynamodb-admin:
    image: instructure/dynamo-local-admin
    container_name: dynamodb-admin
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb
volumes:
  dynamodb_data:
  valkey_data:
