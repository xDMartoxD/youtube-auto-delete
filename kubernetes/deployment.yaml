apiVersion: apps/v1
kind: Deployment
metadata:
    name: youtube-auto-delete-api
    namespace: default
    labels:
        app: youtube-auto-delete-api
        version: v1
spec:
    replicas: 1
    selector:
        matchLabels:
            app: youtube-auto-delete-api
    template:
        metadata:
            labels:
                app: youtube-auto-delete-api
                version: v1
        spec:
            # Service Account for IRSA (IAM Roles for Service Accounts)
            # This allows the pod to assume an IAM role for AWS services access
            serviceAccountName: youtube-auto-delete-api-sa

            containers:
                - name: fastapi
                  image: <YOUR_ECR_REGISTRY>/youtube-auto-delete-api:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                        name: http
                        protocol: TCP

                  env:
                      # App Configuration
                      - name: APP_ENV
                        value: "production"
                      - name: LOG_LEVEL
                        value: "INFO"
                      - name: PYTHONPATH
                        value: "/app"

                      # DynamoDB Configuration
                      - name: TABLE_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: table_name
                      - name: AWS_REGION
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: aws_region
                      # DYNAMODB_ENDPOINT should be empty/not set for production (uses AWS DynamoDB)
                      # AWS credentials are handled via IRSA (IAM Roles for Service Accounts)

                      # Google OAuth Configuration
                      - name: GOOGLE_CLIENT_ID
                        valueFrom:
                            secretKeyRef:
                                name: youtube-auto-delete-secrets
                                key: google_client_id
                      - name: GOOGLE_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: youtube-auto-delete-secrets
                                key: google_client_secret

                      # JWT Configuration
                      - name: JWT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: youtube-auto-delete-secrets
                                key: jwt_secret

                      # CORS Configuration
                      - name: CORS_ORIGINS
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: cors_origins

                      # Redis/ElastiCache Configuration
                      - name: REDIS_URL
                        valueFrom:
                            secretKeyRef:
                                name: youtube-auto-delete-secrets
                                key: redis_url
                      - name: REDIS_USE_TLS
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: redis_use_tls

                      # Rate Limiting Configuration
                      - name: RATE_LIMIT_ENABLED
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: rate_limit_enabled
                      - name: RATE_LIMIT_PER_MINUTE
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: rate_limit_per_minute
                      - name: RATE_LIMIT_PER_HOUR
                        valueFrom:
                            configMapKeyRef:
                                name: youtube-auto-delete-config
                                key: rate_limit_per_hour

                  # Resource Limits
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "250m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"

                  # Health Checks
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 80
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3

                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3

                  # Security Context
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL

            # Pod Security
            securityContext:
                fsGroup: 1000

            # Restart Policy
            restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
    name: youtube-auto-delete-api
    namespace: default
    labels:
        app: youtube-auto-delete-api
spec:
    type: LoadBalancer # Use ClusterIP if you have an Ingress controller
    ports:
        - port: 80
          targetPort: 80
          protocol: TCP
          name: http
    selector:
        app: youtube-auto-delete-api
    sessionAffinity: ClientIP
    sessionAffinityConfig:
        clientIP:
            timeoutSeconds: 10800 # 3 hours

