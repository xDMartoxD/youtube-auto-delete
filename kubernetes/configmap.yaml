apiVersion: v1
kind: ConfigMap
metadata:
    name: youtube-auto-delete-config
    namespace: default
data:
    # DynamoDB Configuration
    table_name: "youtube-auto-delete"
    aws_region: "us-east-1"

    # CORS Configuration
    cors_origins: "https://youtube-auto-delete.com,https://www.youtube-auto-delete.com"

    # Redis/ElastiCache Configuration
    redis_use_tls: "true"

    # Rate Limiting Configuration
    rate_limit_enabled: "true"
    rate_limit_per_minute: "60"
    rate_limit_per_hour: "1000"

    # Cache TTL Configuration (in seconds)
    cache_ttl_user_playlists: "1800"
    cache_ttl_playlist_videos: "3600"
    cache_ttl_playlist_videos_by_date: "3600"
    cache_ttl_user_profile: "3600"
    cache_ttl_user_session: "600"
    cache_ttl_default: "3600"

    python_path: "/app"
    app_env: "production"
    google_client_id: "1045602413659-ns6cq27oi7ro1vj9pd9m8biq7q59j259.apps.googleusercontent.com"
    google_client_secret: "***REMOVED***"
    session_secret: "***REMOVED***"
